# Frigate 0.18.2. Copy into frigate/config.yml; never commit camera credentials.
# Add every installed camera using this same pattern. IDs must match the app.
mqtt:
  enabled: false
ffmpeg:
  hwaccel_args: preset-vaapi
# Disable object inference in v1. Motion processing remains available.
detect:
  enabled: false
record:
  enabled: true
  continuous:
    days: 14
# No management API or RTSP ports are exposed beyond localhost in Compose.
go2rtc:
  streams:
    cam_01:
      - rtsp://{FRIGATE_CAM_USER}:{FRIGATE_CAM_PASSWORD}@{FRIGATE_CAM01_HOST}:554/stream0#backchannel=0
      - ffmpeg:cam_01#video=h264#hardware
    cam_01_sub:
      - rtsp://{FRIGATE_CAM_USER}:{FRIGATE_CAM_PASSWORD}@{FRIGATE_CAM01_HOST}:554/stream1#backchannel=0
      - ffmpeg:cam_01_sub#video=h264#hardware
cameras:
  cam_01:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/cam_01
          input_args: preset-rtsp-restream
          roles: [record]
        - path: rtsp://127.0.0.1:8554/cam_01_sub
          input_args: preset-rtsp-restream
          roles: [detect]
    detect:
      width: 640
      height: 360
      fps: 5
